name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Hello:
    name: Say Hello
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echo PR Title
        run: echo ${{ github.event.pull_request.title }}
      - name: Run Apex Tests
        run: sf apex run test --target-org aasenv --class-names ConstantsTest --synchronous
